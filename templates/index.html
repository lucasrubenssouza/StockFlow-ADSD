<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><title>StockFlow</title><link rel="stylesheet" href="/static/style.css"></head><body><main><h1>StockFlow</h1><form><input name="q" value="{{busca}}" placeholder="Pesquisar produto"><button>Pesquisar</button></form><a href="/produto/novo">Cadastrar produto</a><table><tr><th>Produto</th><th>Categoria</th><th>Qtd.</th><th>Preço</th><th>Atualizar</th></tr>{% for p in produtos %}<tr><td>{{p.nome}}</td><td>{{p.categoria}}</td><td>{{p.quantidade}}</td><td>R$ {{'%.2f'|format(p.preco)}}</td><td><form method="post" action="/produto/{{p.id_produto}}/quantidade"><input name="quantidade" type="number" min="0" required><button>Salvar</button></form></td></tr>{% endfor %}</table></main></body></html>
